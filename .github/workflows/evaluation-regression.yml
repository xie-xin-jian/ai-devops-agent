name: Evaluation Regression

on:
  workflow_call:
    inputs:
      baseline_artifact:
        description: Artifact containing the baseline evaluation report
        required: true
        type: string
      current_artifact:
        description: Artifact containing the candidate evaluation report
        required: true
        type: string
      tolerance:
        description: Allowed pass-rate drop, from 0.0 to 1.0
        required: false
        default: "0"
        type: string
      fail_on_missing:
        description: Fail when a baseline case is absent from the candidate
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download baseline report
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.baseline_artifact }}
          path: eval-artifacts/baseline

      - name: Download candidate report
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.current_artifact }}
          path: eval-artifacts/current

      - name: Compare reports
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="$(find eval-artifacts/baseline -type f -name '*.json' | head -n 1)"
          CURRENT="$(find eval-artifacts/current -type f -name '*.json' | head -n 1)"
          if [ -z "$BASELINE" ] || [ -z "$CURRENT" ]; then
            echo "Both artifacts must contain at least one JSON report." >&2
            exit 1
          fi

          MISSING_FLAG=""
          if [ "${{ inputs.fail_on_missing }}" = "true" ]; then
            MISSING_FLAG="--fail-on-missing"
          fi

          python scripts/compare_eval.py \
            "$BASELINE" \
            "$CURRENT" \
            --tolerance "${{ inputs.tolerance }}" \
            --output eval-artifacts/comparison.json \
            --fail-on-regression \
            $MISSING_FLAG

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-comparison
          path: eval-artifacts/comparison.json
          if-no-files-found: warn
