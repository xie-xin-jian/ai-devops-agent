version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MODEL_ID=${MODEL_ID}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
      - API_AUTH_TOKEN=${API_AUTH_TOKEN}
      - API_AUTH_USER=${API_AUTH_USER:-api-user}
      - API_AUTH_ROLES=${API_AUTH_ROLES:-platform-admin}
      - DOCKER_HOST=${DOCKER_HOST:-}
      - SANDBOX_ENABLED=${SANDBOX_ENABLED:-1}
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-python:3.11-slim}
      - SANDBOX_TIMEOUT_SECONDS=${SANDBOX_TIMEOUT_SECONDS:-120}
      - SANDBOX_MEMORY_LIMIT=${SANDBOX_MEMORY_LIMIT:-512m}
      - SANDBOX_CPUS=${SANDBOX_CPUS:-1.0}
      - SANDBOX_PIDS_LIMIT=${SANDBOX_PIDS_LIMIT:-128}
      - SANDBOX_NETWORK_DISABLED=${SANDBOX_NETWORK_DISABLED:-1}
      - SANDBOX_USER=${SANDBOX_USER:-65534:65534}
      - ENABLE_UNSAFE_MCP_SHELL=${ENABLE_UNSAFE_MCP_SHELL:-0}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8000,http://127.0.0.1:5173,http://127.0.0.1:8000}
    volumes:
      - .:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
