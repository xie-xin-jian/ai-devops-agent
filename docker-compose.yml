version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MODEL_ID=${MODEL_ID}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
      - API_AUTH_TOKEN=${API_AUTH_TOKEN}
      - ENABLE_UNSAFE_MCP_SHELL=${ENABLE_UNSAFE_MCP_SHELL:-0}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8000,http://127.0.0.1:5173,http://127.0.0.1:8000}
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
