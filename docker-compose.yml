services:
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MODEL_ID=${MODEL_ID}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
      - API_AUTH_TOKEN=${API_AUTH_TOKEN}
      - API_AUTH_USER=${API_AUTH_USER:-api-user}
      - API_AUTH_ROLES=${API_AUTH_ROLES:-platform-admin}
      - SANDBOX_ENABLED=${SANDBOX_ENABLED:-1}
      - ENABLE_UNSAFE_MCP_SHELL=${ENABLE_UNSAFE_MCP_SHELL:-0}
      - ENABLE_MOCK_MCP=${ENABLE_MOCK_MCP:-0}
      - TARGET_BROWSE_ROOTS=${TARGET_BROWSE_ROOTS:-/opt,/srv}
      - PERSISTENCE_BACKEND=${PERSISTENCE_BACKEND:-json}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://ai_devops:change-me@postgres:5432/ai_devops}
      - DB_AUTO_MIGRATE=${DB_AUTO_MIGRATE:-0}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8000,http://127.0.0.1:5173,http://127.0.0.1:8000}
    volumes:
      - .:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_devops}
      POSTGRES_USER: ${POSTGRES_USER:-ai_devops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-ai_devops} -d ${POSTGRES_DB:-ai_devops}
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
